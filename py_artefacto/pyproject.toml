[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "xss-sandbox-audit"
version = "1.0.0"
description = "XSS payload injection tool for sandbox security auditing"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Security Research Team", email = "security@example.com"}
]
keywords = ["security", "xss", "sandbox", "testing", "audit"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Operating System :: Microsoft :: Windows",
]
dependencies = [
    "requests>=2.28.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/xss-sandbox-audit"
Documentation = "https://github.com/yourusername/xss-sandbox-audit#readme"
Repository = "https://github.com/yourusername/xss-sandbox-audit"
Issues = "https://github.com/yourusername/xss-sandbox-audit/issues"

[project.scripts]
xss-audit = "xss_audit.cli:main"

[tool.setuptools]
packages = ["xss_audit", "xss_audit.injectors"]
